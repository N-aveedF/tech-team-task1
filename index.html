<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; background-color: #fafafa; color: #333; padding-bottom: 50px; }
        .top-bar { background-color: #3b3a4a; height: 12px; width: 100%; }
        .container { max-width: 550px; margin: 60px auto; text-align: center; padding: 0 20px; }
        h1 { font-size: 3rem; font-weight: 800; letter-spacing: 3px; color: #222; margin-bottom: 5px; text-transform: uppercase; }
        .subtitle { font-size: 0.85rem; color: #666; letter-spacing: 1px; margin-bottom: 40px; font-weight: 600; }
        .card { background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); text-align: left; margin-bottom: 30px; }
        .card-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; color: #222; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid #eaeaea; padding-bottom: 10px; }
        .input-group { margin-bottom: 25px; }
        label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; box-sizing: border-box; padding: 16px; border: 1.5px solid #eaeaea; border-radius: 8px; font-size: 1rem; font-family: 'Inter', sans-serif; transition: all 0.3s ease; background-color: #fdfdfd; }
        input:focus { outline: none; border-color: #3b3a4a; background-color: #fff; }
        button { width: 100%; padding: 18px; background-color: #3b3a4a; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; letter-spacing: 1px; cursor: pointer; transition: background-color 0.3s ease, transform 0.1s ease; }
        button:hover { background-color: #2a2935; }
        button:active { transform: scale(0.98); }
        .btn-outline { background-color: transparent; color: #3b3a4a; border: 2px solid #3b3a4a; }
        .btn-outline:hover { background-color: #f4f4f5; }
        .result-area { margin-top: 25px; font-size: 1rem; line-height: 1.6; text-align: center; word-break: break-all; }
        .success-box { padding: 20px; background-color: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; color: #166534; }
        .success-box a { color: #007bff; font-weight: 600; text-decoration: none; }
        .success-box a:hover { text-decoration: underline; }
        .analytics-box { padding: 20px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; text-align: left; font-size: 0.9rem; }
        .analytics-box h3 { margin-top: 0; color: #0f172a; }
        .history-list { max-height: 150px; overflow-y: auto; background: #fff; border: 1px solid #eaeaea; border-radius: 6px; padding: 10px; margin-top: 10px; list-style-type: none; }
        .history-list li { padding: 5px 0; border-bottom: 1px solid #f1f1f1; color: #555; font-family: monospace; }
        .history-list li:last-child { border-bottom: none; }
        .expiry-text { color: #991b1b; font-size: 0.85rem; display: block; margin-top: 8px; }
        .error-text { color: #dc2626; font-weight: 600; }
    </style>
</head>
<body>
    <div class="top-bar"></div>
    
    <div class="container">
        <h1>Shortener</h1>
        <div class="subtitle">SHORTEN & SHARE &nbsp;|&nbsp; TRACK EVERY CLICK</div>
        
        <!-- CARD 1: URL CREATOR -->
        <div class="card">
            <div class="card-title">Create Link</div>
            <div class="input-group">
                <label>Target URL</label>
                <input type="text" id="urlInput" placeholder="https://example.com/very-long-link">
            </div>
            <div class="input-group">
                <label>Custom Alias (Optional)</label>
                <input type="text" id="aliasInput" placeholder="e.g., my-link">
            </div>
            <div class="input-group">
                <label>Expiration Date (Optional)</label>
                <input type="datetime-local" id="expiryInput">
            </div>
            <button onclick="shortenUrl()" id="createBtn">GENERATE SHORT LINK</button>
            <div id="result" class="result-area"></div>
        </div>

        <!-- CARD 2: ANALYTICS -->
        <div class="card">
            <div class="card-title">Link Analytics</div>
            <div class="input-group">
                <label>Enter Short Code / Alias</label>
                <input type="text" id="statsInput" placeholder="e.g., my-link">
            </div>
            <button class="btn-outline" onclick="checkAnalytics()" id="statsBtn">CHECK VISITS</button>
            <div id="statsResult" class="result-area"></div>
        </div>
    </div>

    <script>
        async function shortenUrl() {
            const url = document.getElementById('urlInput').value;
            const alias = document.getElementById('aliasInput').value;
            let exp = document.getElementById('expiryInput').value;
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('createBtn');

            btn.innerHTML = "GENERATING...";
            btn.style.opacity = "0.7";

            if (exp) {
                exp = exp.replace('T', ' ') + ':00';
            } else {
                exp = null;
            }

            try {
                const response = await fetch('/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, alias: alias || null, exp: exp })
                });

                const data = await response.json();
                
                if (response.ok) {
                    let htmlOutput = `<div class="success-box">
                        Your shortened link is ready:<br>
                        <a href="${data.short_url}" target="_blank">${data.short_url}</a>`;
                    
                    if (data.expires) {
                        htmlOutput += `<span class="expiry-text">Expires on: ${data.expires}</span>`;
                    }
                    htmlOutput += `</div>`;
                    resultDiv.innerHTML = htmlOutput;
                } else {
                    resultDiv.innerHTML = `<span class="error-text">Error: ${data.detail}</span>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error-text">Network error occurred.</span>`;
            } finally {
                btn.innerHTML = "GENERATE SHORT LINK";
                btn.style.opacity = "1";
            }
        }

        async function checkAnalytics() {
            const shortCode = document.getElementById('statsInput').value;
            const statsResultDiv = document.getElementById('statsResult');
            const btn = document.getElementById('statsBtn');

            if (!shortCode) {
                statsResultDiv.innerHTML = `<span class="error-text">Please enter a short code.</span>`;
                return;
            }

            btn.innerHTML = "CHECKING...";
            btn.style.opacity = "0.7";

            try {
                // Fetch request without password parameter
                const response = await fetch(`/analytics/${shortCode}`);
                const data = await response.json();
                
                if (response.ok) {
                    let htmlOutput = `<div class="analytics-box">
                        <h3>Total Visits: ${data.total_visits}</h3>`;
                    
                    if (data.total_visits > 0) {
                        htmlOutput += `<label>Visit History (Timestamps):</label>
                                       <ul class="history-list">`;
                        data.history.forEach(time => {
                            const dateObj = new Date(time);
                            htmlOutput += `<li>${dateObj.toLocaleString()}</li>`;
                        });
                        htmlOutput += `</ul>`;
                    } else {
                        htmlOutput += `<p style="color: #666;">No visits recorded yet.</p>`;
                    }
                    htmlOutput += `</div>`;
                    statsResultDiv.innerHTML = htmlOutput;
                } else {
                    statsResultDiv.innerHTML = `<span class="error-text">${data.detail || "Code not found."}</span>`;
                }
            } catch (error) {
                statsResultDiv.innerHTML = `<span class="error-text">Network error occurred.</span>`;
            } finally {
                btn.innerHTML = "CHECK VISITS";
                btn.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
